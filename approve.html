<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jynx — approve</title>
<!--
  The approval page.

  Everything it needs arrives in the URL FRAGMENT, which a browser never sends
  to the server. GitHub Pages therefore serves this file having no idea what is
  being approved, by whom, or for what — it is a static page that learns
  everything from the link that opened it.

  It never sends the PIN. It derives PBKDF2(pin, salt) with Web Crypto and posts
  HMAC(that, requestId) — a proof bound to one request, which cannot be run
  backwards and cannot approve anything else. With an authenticator it posts the
  six-digit code, which is worthless thirty seconds later and is burned on use.

  BOTH approve and deny need that proof. A deny anyone could press is a
  denial-of-service on your own team, and it is why the notification carries one
  button rather than two.

  The page is single-use. It asks the channel whether this request has already
  been decided — on load, while open, and after acting — and once it has, the
  controls are gone for good. Reopening the link shows the outcome, not a form.
-->
<style>
  :root{
    color-scheme: light dark;
    --bg:#F4F5F7; --panel:#fff; --ink:#0B0D12; --dim:#5B6272; --line:#E1E4EA;
    --jynx:#7C5CFC; --lilac:#9B82FF; --ok:#16A34A; --bad:#DC2626;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#05070A; --panel:#12151C; --ink:#F2F4F8; --dim:#98A0B0; --line:#242A36;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    width:100%;max-width:420px;padding:26px 22px;box-shadow:0 18px 50px rgba(0,0,0,.10)}
  .mark{display:flex;align-items:center;gap:9px;margin-bottom:22px}
  .eyes{display:flex;gap:5px}
  .eyes i{width:7px;height:7px;border-radius:50%;background:var(--jynx)}
  .mark b{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--dim);font-weight:500}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  h1{font-size:21px;line-height:1.32;margin:0 0 14px;letter-spacing:-.01em;font-weight:700}
  .why{font-size:14.5px;line-height:1.6;color:var(--dim);margin:0 0 16px}
  .run{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;margin:0 0 16px;overflow-x:auto;white-space:pre;color:var(--ink)}
  .from{font-family:var(--mono);font-size:11px;color:var(--dim);margin:0 0 22px;
    padding-top:14px;border-top:1px solid var(--line)}
  input{width:100%;font-family:var(--mono);font-size:22px;letter-spacing:.5em;text-align:center;
    padding:15px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);
    color:var(--ink);outline:none;-webkit-appearance:none}
  input:focus{border-color:var(--jynx)}
  .row{display:flex;gap:9px;margin-top:14px}
  button{flex:1;padding:15px;border-radius:11px;border:1px solid var(--line);cursor:pointer;
    font-family:var(--body);font-weight:700;font-size:15px;background:transparent;color:var(--dim);
    min-height:52px;-webkit-appearance:none}
  button.go{background:var(--jynx);border-color:var(--jynx);color:#fff}
  button:disabled{opacity:.45}
  .msg{margin-top:16px;font-size:14px;line-height:1.5;text-align:center;min-height:20px}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:0 0 18px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
  .pill.live{color:var(--jynx);border-color:var(--jynx)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.bad{color:var(--bad);border-color:var(--bad)}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .done{text-align:center;padding:10px 0 4px}
  .done h2{font-size:19px;margin:0 0 8px;letter-spacing:-.01em}
  .done p{font-size:14px;color:var(--dim);margin:0;line-height:1.6}
  .setup{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;
    font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--ink);
    overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .note{margin-top:18px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--dim);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><span class="eyes"><i></i><i></i></span><b>JYNX</b></div>
  <div id="view"></div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view");
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; };

  /* ---- setup mode: #setup=<who> ---- */
  var hash = location.hash.slice(1);
  if (hash.indexOf("setup=") === 0) return setupMode(decodeURIComponent(hash.slice(6)), null);
  if (hash.indexOf("enrol=") === 0) {
    try {
      var e = JSON.parse(decodeURIComponent(escape(atob(hash.slice(6) + "===".slice((hash.length - 6 + 3) % 4)))));
      return setupMode(e.who, e);
    } catch (x) { /* fall through to the error below */ }
  }

  function setupMode(who, enrol) {
    var b32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    function enc32(bytes) {
      var bits = 0, value = 0, out = "";
      for (var i = 0; i < bytes.length; i++) {
        value = (value << 8) | bytes[i]; bits += 8;
        while (bits >= 5) { out += b32[(value >>> (bits - 5)) & 31]; bits -= 5; }
      }
      if (bits > 0) out += b32[(value << (5 - bits)) & 31];
      return out;
    }
    function dec32(str) {
      var bits = 0, value = 0, out = [];
      str = str.toUpperCase().replace(/[^A-Z2-7]/g, "");
      for (var i = 0; i < str.length; i++) {
        value = (value << 5) | b32.indexOf(str[i]); bits += 5;
        if (bits >= 8) { out.push((value >>> (bits - 8)) & 255); bits -= 8; }
      }
      return new Uint8Array(out);
    }
    async function totpNow(secret) {
      var step = Math.floor(Date.now() / 30000);
      var msg = new Uint8Array(8);
      for (var i = 7; i >= 0; i--) { msg[i] = step & 255; step = Math.floor(step / 256); }
      var key = await crypto.subtle.importKey("raw", dec32(secret), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
      var h = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
      var off = h[h.length - 1] & 15;
      var code = ((h[off] & 127) << 24 | h[off + 1] << 16 | h[off + 2] << 8 | h[off + 3]) % 1e6;
      return ("00000" + code).slice(-6);
    }

    var secret = enc32(crypto.getRandomValues(new Uint8Array(20)));
    var mode = "pin";

    function paint() {
      view.innerHTML =
        '<div class="lbl">Set up approvals</div>' +
        '<h1>' + esc(who) + '</h1>' +
        '<p class="why">Your key is built <strong>here in the browser</strong>' +
          (enrol && enrol.token
            ? ' and sent straight to the terminal that is waiting for it, encrypted so only that terminal can read it. Nothing to paste.'
            : ' and handed back as one line to paste into a terminal.') + '</p>' +
        '<div class="row" style="margin-bottom:16px">' +
        '<button id="mpin" class="' + (mode === "pin" ? "go" : "") + '">PIN</button>' +
        '<button id="mtotp" class="' + (mode === "totp" ? "go" : "") + '">Authenticator</button></div>' +
        (mode === "pin"
          ? '<div class="lbl">Choose a PIN</div><input id="p1" type="tel" inputmode="numeric" maxlength="12" placeholder="••••">' +
            '<div class="lbl" style="margin-top:12px">Again</div><input id="p2" type="tel" inputmode="numeric" maxlength="12" placeholder="••••">'
          : '<p class="why">Add this to your authenticator, then type the code it shows.</p>' +
            '<div class="setup" id="uri"></div>' +
            '<div class="lbl" style="margin-top:12px">Code it shows</div>' +
            '<input id="p1" type="tel" inputmode="numeric" maxlength="6" placeholder="······">') +
        '<div class="row"><button id="build" class="go" style="width:100%">Build my key</button></div>' +
        '<div class="msg" id="msg"></div>' +
        '<div id="out"></div>';

      if (mode === "totp") {
        var uri = "otpauth://totp/Jynx:" + encodeURIComponent(who) + "?secret=" + secret + "&issuer=Jynx&period=30&digits=6";
        $("uri").textContent = uri + "\n\nor type it:  " + secret.replace(/(.{4})/g, "$1 ").trim();
      }
      $("mpin").onclick = function () { mode = "pin"; paint(); };
      $("mtotp").onclick = function () { mode = "totp"; paint(); };
      $("build").onclick = build;
    }

    async function build() {
      var m = $("msg"); m.className = "msg";
      var v1 = ($("p1").value || "").trim();
      var blob;
      if (mode === "pin") {
        var v2 = ($("p2").value || "").trim();
        if (!/^\d{4,12}$/.test(v1)) { m.textContent = "Four to twelve digits."; m.className = "msg bad"; return; }
        if (v1 !== v2) { m.textContent = "They do not match."; m.className = "msg bad"; return; }
        m.textContent = "Deriving…";
        var salt = crypto.getRandomValues(new Uint8Array(16));
        var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(v1), "PBKDF2", false, ["deriveBits"]);
        var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: 210000, hash: "SHA-256" }, base, 256);
        var hx = function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); };
        blob = { who: who, auth: "pin", salt: hx(salt), verifier: hx(bits) };
      } else {
        if (!/^\d{6}$/.test(v1)) { m.textContent = "Six digits from the app."; m.className = "msg bad"; return; }
        if (await totpNow(secret) !== v1) { m.textContent = "That code does not match — check the clock on your phone."; m.className = "msg bad"; return; }
        blob = { who: who, auth: "totp", totp: secret };
      }
      /* With a token, the page delivers it itself — encrypted with a key only
         the waiting terminal has, so the channel carries ciphertext. Without
         one, fall back to a line to paste, which is the only option left when
         nothing is waiting to receive it. */
      if (enrol && enrol.token) {
        m.textContent = "Sending…";
        try {
          var salt = crypto.getRandomValues(new Uint8Array(16));
          var iv = crypto.getRandomValues(new Uint8Array(12));
          var kb = await crypto.subtle.importKey("raw", new TextEncoder().encode(enrol.token), "PBKDF2", false, ["deriveKey"]);
          var ak = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                                                 kb, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
          var ctBuf = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, ak,
            new TextEncoder().encode(JSON.stringify(blob))));
          /* WebCrypto appends the tag; node wants it separately, so it is split
             at a fixed offset on the other side. */
          var packed = new Uint8Array(12 + ctBuf.length);
          packed.set(iv); packed.set(ctBuf, 12);
          var payload = btoa(String.fromCharCode.apply(null, packed));
          var saltHex = Array.prototype.map.call(salt, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
          await fetch("https://ntfy.sh/" + enrol.topic, { method: "POST", headers: { Priority: "1" },
            body: "enrol " + saltHex + " " + payload });
        } catch (x) { m.textContent = "Could not send it."; m.className = "msg bad"; return; }

        var until = Date.now() + 30000;
        while (Date.now() < until) {
          try {
            var res = await fetch("https://ntfy.sh/" + enrol.topic + "/json?poll=1&since=" + (Math.floor(Date.now() / 1000) - 60));
            var txt = await res.text();
            if (txt.indexOf("enrolled " + who) > -1) {
              view.innerHTML = '<div class="done"><span class="pill ok"><i></i>set up</span>' +
                '<h2 style="margin-top:14px">You are ready</h2>' +
                '<p>Your key is on the machine, not here. Nothing to paste, nothing to remember but the ' +
                (mode === "pin" ? "PIN" : "code") + '.</p>' +
                '<div class="setup" style="margin-top:16px;text-align:left">npm run listen</div>' +
                '<p class="note" style="text-align:left">Leave that running, or approvals reach a channel with nobody reading it.</p></div>';
              return;
            }
          } catch (x) { /* keep waiting */ }
          await new Promise(function (r) { setTimeout(r, 2000); });
        }
        m.textContent = "Sent, but the terminal did not answer. Is npm run approve -- --setup still waiting?";
        m.className = "msg bad";
        return;
      }

      var b64 = btoa(JSON.stringify(blob)).replace(/=+$/, "");
      var line = "npm run approve -- --enroll " + b64 + " --as " + who;
      m.textContent = "";
      $("out").innerHTML =
        '<div class="lbl" style="margin-top:18px">Paste this into a terminal, in the jynx repo</div>' +
        '<div class="setup" id="cmd">' + esc(line) + '</div>' +
        '<div class="row"><button id="copy" style="width:100%">Copy the line</button></div>' +
        '<p class="note" style="text-align:left">This link had no terminal waiting for it, so there is a line to carry across. Run it on the machine that will hold the key.</p>';
      $("copy").onclick = function () {
        navigator.clipboard.writeText(line).then(function () { $("copy").textContent = "Copied"; },
          function () { $("copy").textContent = "Select it and copy by hand"; });
      };
    }
    paint();
  }

  /* ---- the request, out of the fragment ---- */
  var req = null;
  try {
    var raw = hash;
    if (!raw) throw 0;
    var pad = raw + "===".slice((raw.length + 3) % 4);
    req = JSON.parse(decodeURIComponent(escape(atob(pad.replace(/-/g, "+").replace(/_/g, "/")))));
    if (!req.id || !req.topic) throw 0;
  } catch (e) {
    view.innerHTML = '<div class="done"><h2>Not a valid approval link</h2>' +
      '<p>Open the one from the notification.</p></div>';
    return;
  }

  var enc = new TextEncoder();
  function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");}
  function bytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}

  async function proof(secret) {
    if (req.auth === "totp") return String(secret).replace(/\s+/g, "");
    var base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: bytes(req.salt), iterations: req.iter || 210000, hash: "SHA-256" }, base, 256);
    var key = await crypto.subtle.importKey("raw", bits, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    return hex(await crypto.subtle.sign("HMAC", key, enc.encode(req.id)));
  }

  var URL_BASE = "https://ntfy.sh/" + req.topic;
  async function poll(since) {
    var res = await fetch(URL_BASE + "/json?poll=1&since=" + since);
    var t = await res.text();
    return (t.trim() ? t.trim().split("\n") : []).map(function (l) {
      try { return JSON.parse(l); } catch (e) { return null; }
    }).filter(function (m) { return m && m.event === "message" && m.message; });
  }
  async function send(body) {
    var res = await fetch(URL_BASE, { method: "POST", headers: { Priority: "3" }, body: body });
    if (!res.ok) throw new Error("could not reach the channel (" + res.status + ")");
  }

  /* Has this already been decided? Asked on load, while open, and after acting —
     the same question every time, so a decision made on another device, in
     another tab, or a second ago all land in the same place. */
  async function decidedSince(since) {
    var msgs = await poll(since);
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      if ((m.time || 0) < since) continue;
      if (m.message.indexOf("decision " + req.id + " approved") > -1) return { state: "approved", at: m.time };
      if (m.message.indexOf("decision " + req.id + " denied") > -1) return { state: "denied", at: m.time };
    }
    return null;
  }

  var expired = req.at && req.ttl && (Date.now() - Date.parse(req.at)) > req.ttl * 3600e3;

  function done(state, detail) {
    var ok = state === "approved";
    view.innerHTML =
      '<div class="done">' +
      '<span class="pill ' + (ok ? "ok" : "bad") + '"><i></i>' + esc(state) + '</span>' +
      '<h2 style="margin-top:14px">' + esc(req.what) + '</h2>' +
      '<p>' + esc(detail) + '</p></div>';
  }

  function needsSetup() {
    view.innerHTML =
      '<div class="lbl">Cannot approve yet</div>' +
      '<h1>No approval set up for ' + esc(req.who) + '</h1>' +
      '<p class="why">Nothing is waiting on this page. On <strong>your own machine</strong>, in the jynx repo, run this once — it stores a key locally and never leaves that machine:</p>' +
      '<div class="setup">npm run approve -- --setup --as ' + esc(req.who) +
      '\n\n# or with an authenticator app instead of a PIN\nnpm run approve -- --setup --as ' + esc(req.who) + ' --totp</div>' +
      '<p class="note" style="text-align:left">Then ask ' + esc(req.from) + ' to send the request again — this link was built before you had a key, so it cannot be used.</p>';
  }

  function form() {
    var isTotp = req.auth === "totp";
    view.innerHTML =
      '<div class="lbl">Approval</div>' +
      '<h1>' + esc(req.what) + '</h1>' +
      (req.why ? '<p class="why">' + esc(req.why) + '</p>' : "") +
      (req.run ? '<pre class="run">' + esc(req.run) + '</pre>' : "") +
      '<p class="meta"><span>asked by ' + esc(req.from) + '</span><span>' + esc(req.id) + '</span>' +
        '<span id="age"></span></p>' +
      '<p class="from" style="margin-bottom:16px"><span class="pill live" id="state"><i></i>waiting</span></p>' +
      '<div class="lbl">' + (isTotp ? "Your authenticator code" : "Your PIN") + '</div>' +
      '<input id="pin" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="' + (isTotp ? 6 : 12) + '" placeholder="' + (isTotp ? "······" : "••••") + '">' +
      '<div class="row"><button id="no">Deny</button><button id="yes" class="go">Approve</button></div>' +
      '<div class="msg" id="msg"></div>' +
      '<p class="note">Both decisions need your ' + (isTotp ? "code" : "PIN") + '. It is never sent — this page derives a proof that works only for this one request.</p>';

    checkAlive();
    if (req.at) {
      var left = Math.max(0, (req.ttl || 24) * 3600e3 - (Date.now() - Date.parse(req.at)));
      $("age").textContent = "expires in " + Math.floor(left / 3600e3) + "h";
    }
    $("yes").addEventListener("click", function () { act("approve"); });
    $("no").addEventListener("click", function () { act("deny"); });
    $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") act("approve"); });
    setTimeout(function () { $("pin").focus(); }, 250);
    watch();
  }

  /* Ask whether a session is actually reading this channel. A PIN typed at
     nobody looks identical to a PIN that was wrong, and the difference matters
     enormously to the person typing it. */
  async function checkAlive() {
    var el = $("state");
    if (!el) return;
    var nonce = Math.random().toString(16).slice(2, 10);
    var from = Math.floor(Date.now() / 1000);
    try { await send("jynx-ping " + nonce); } catch (e) { return; }
    var until = Date.now() + 6000;
    while (Date.now() < until) {
      await new Promise(function (r) { setTimeout(r, 1200); });
      try {
        var msgs = await poll(from);
        for (var i = 0; i < msgs.length; i++) {
          if (msgs[i].message.indexOf("jynx-pong " + nonce) > -1) {
            el.className = "pill live"; el.innerHTML = "<i></i>waiting for you";
            return;
          }
        }
      } catch (e) { /* keep asking */ }
    }
    el.className = "pill bad"; el.innerHTML = "<i></i>nothing is listening";
    var m = $("msg");
    if (m) {
      m.className = "msg bad";
      m.innerHTML = "No session is reading " + esc(req.who) + "&rsquo;s channel, so a decision here will not take effect yet. " +
        "Run <strong>npm run listen</strong> and this will turn green.";
    }
  }

  var acting = false;
  function msg(t, k) { var m = $("msg"); if (m) { m.textContent = t; m.className = "msg" + (k ? " " + k : ""); } }
  function busy(on) { acting = on; if ($("yes")) $("yes").disabled = on; if ($("no")) $("no").disabled = on; }

  async function act(verb) {
    if (acting) return;
    var secret = ($("pin").value || "").trim();
    var isTotp = req.auth === "totp";
    if (isTotp ? !/^\d{6}$/.test(secret) : !/^\d{4,12}$/.test(secret)) {
      msg(isTotp ? "Six digits from your authenticator." : "Enter your PIN.", "bad"); return;
    }
    busy(true); msg("Checking…");
    var p;
    try { p = await proof(secret); } catch (e) { msg("Could not compute the proof.", "bad"); busy(false); return; }
    var from = Math.floor(Date.now() / 1000);
    try { await send(verb + " " + req.id + " " + p); }
    catch (e) { msg(e.message, "bad"); busy(false); return; }

    /* The page cannot tell whether the secret was right — the session holding
       the key decides. Saying "approved" at the moment of sending was a lie on
       a wrong PIN, and the worst kind: it says the job is done when it is not. */
    var deadline = Date.now() + 30000;
    while (Date.now() < deadline) {
      try {
        var msgs = await poll(from);
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          if ((m.time || 0) < from) continue;
          if (m.message.indexOf("decision " + req.id + " approved") > -1)
            return done("approved", "Nothing more to do. This link is now spent.");
          if (m.message.indexOf("decision " + req.id + " denied") > -1)
            return done("denied", "Nothing will happen. This link is now spent.");
          if (m.message.indexOf("decision " + req.id + " rejected") > -1) {
            msg(isTotp ? "That code did not match. Try the current one." : "That PIN was wrong.", "bad");
            $("pin").value = ""; busy(false); $("pin").focus(); return;
          }
          if (m.message.indexOf("decision " + req.id + " locked") > -1)
            return done("denied", "Too many failed attempts — approvals are locked for fifteen minutes.");
        }
      } catch (e) { /* keep waiting */ }
      await new Promise(function (r) { setTimeout(r, 2000); });
    }
    /* Nothing answered. That is not a wrong PIN and it is not a network
       problem — it means no session is reading this person's channel, so the
       tap went somewhere with nobody there. Saying that plainly beats
       re-enabling the buttons, which reads as "try again" and is why the same
       request could be pressed over and over with no effect. */
    view.innerHTML =
      '<div class="done">' +
      '<span class="pill bad"><i></i>nothing listening</span>' +
      '<h2 style="margin-top:14px">' + esc(req.what) + '</h2>' +
      '<p>Your ' + (req.auth === "totp" ? "code" : "PIN") + ' was sent, but no session is reading ' +
      esc(req.who) + '&rsquo;s channel, so nothing verified it. It is still pending.</p>' +
      '<div class="setup" style="margin-top:16px;text-align:left">npm run listen</div>' +
      '<p class="note" style="text-align:left">Run that on the machine with the Jynx repo, then reopen this link.</p>' +
      '</div>';
  }

  /* While the page is open, keep asking. Someone may decide on another device. */
  async function watch() {
    var since = Math.floor(Date.now() / 1000) - 60;
    for (;;) {
      await new Promise(function (r) { setTimeout(r, 4000); });
      if (acting) continue;
      try {
        var d = await decidedSince(since);
        if (d) return done(d.state, "Decided elsewhere. This link is now spent.");
      } catch (e) { /* offline; keep trying */ }
    }
  }

  (async function start() {
    view.innerHTML = '<div class="lbl">Approval</div><h1>Checking…</h1>';
    if (req.auth === "none") return needsSetup();
    if (expired) return done("denied", "This request expired after " + (req.ttl || 24) + " hours without an answer. Ask again if it still matters.");
    try {
      var already = await decidedSince(Math.floor(Date.parse(req.at || Date.now()) / 1000));
      if (already) return done(already.state, "This was already decided. The link is spent.");
    } catch (e) { /* if the check fails, still offer the form */ }
    form();
  })();
})();
</script>
</body>
</html>
