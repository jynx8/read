<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jynx — internal</title>
<!--
  The internal dashboard.

  Everything below the passphrase is AES-256-GCM ciphertext, built by
  scripts/dashboard.mjs and decrypted here in the browser. The host serving this
  file cannot read a word of it, which is the only honest way to put internal
  state on a static host somebody else runs.

  The passphrase unlocks READING. It does not authorise anything: a page's code
  is readable and its checks are bypassable, so this page never decides. Actions
  are posted to a channel and a listening session with the real secret decides,
  after checking an authenticator code. Reading and doing are different
  questions and they get different answers.
-->
<style>
  :root{
    color-scheme: light dark;
    --bg:#F4F5F7; --panel:#fff; --sunk:#F8F9FB; --ink:#0B0D12; --dim:#5B6272; --line:#E1E4EA;
    --jynx:#7C5CFC; --lilac:#9B82FF; --ice:#0EA5E9; --ok:#16A34A; --warn:#D97706; --bad:#DC2626;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#05070A; --panel:#0F131A; --sunk:#0A0D13; --ink:#F2F4F8; --dim:#98A0B0; --line:#1D242F;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 70px}

  .top{display:flex;align-items:center;gap:12px;padding:14px 0 20px;flex-wrap:wrap}
  .eyes{display:flex;gap:5px}.eyes i{width:8px;height:8px;border-radius:50%;background:var(--jynx)}
  .top b{font-family:var(--mono);font-size:13px;letter-spacing:.24em;font-weight:500}
  .top .cls{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:3px 9px}
  .top .built{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  .gate{max-width:400px;margin:11vh auto;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:28px 24px}
  .gate h1{font-size:20px;margin:0 0 8px}
  .gate p{color:var(--dim);font-size:14px;margin:0 0 18px}
  input{width:100%;font-family:var(--mono);font-size:16px;padding:14px;border:1px solid var(--line);
    border-radius:11px;background:var(--sunk);color:var(--ink);outline:none;-webkit-appearance:none}
  input:focus{border-color:var(--jynx)}
  button{border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:var(--body);font-weight:700;font-size:14px;padding:12px 16px;cursor:pointer;min-height:46px}
  button.go{background:var(--jynx);border-color:var(--jynx);color:#fff;width:100%;margin-top:12px}
  button:disabled{opacity:.45}
  .err{color:var(--bad);font-size:13.5px;margin-top:12px;min-height:18px}

  nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
  nav button{border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--dim);
    font-size:13px;padding:10px 13px;min-height:0;font-weight:700}
  nav button.on{color:var(--ink);border-bottom-color:var(--jynx)}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
  .card h3{margin:0 0 12px;font-size:12px;font-family:var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);font-weight:500}
  .big{font-family:var(--mono);font-size:26px;letter-spacing:-.02em;color:var(--jynx)}
  .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--dim);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.k{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .scroll{overflow-x:auto}

  .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
  .tag.done{color:var(--ok);border-color:var(--ok)}
  .tag.doing{color:var(--jynx);border-color:var(--jynx)}
  .tag.human,.tag.medium{color:var(--warn);border-color:var(--warn)}
  .tag.blocked,.tag.high{color:var(--bad);border-color:var(--bad)}
  .tag.demo{color:var(--warn);border-color:var(--warn)}
  .tag.internal{color:var(--ice);border-color:var(--ice)}

  .who{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .who h2{font-size:17px;margin:0}
  .who .s{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .muted{color:var(--dim);font-size:13px}
  .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .act input{width:120px;text-align:center;letter-spacing:.3em;font-size:15px;padding:11px}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div class="gate">
    <h1>Jynx internal</h1>
    <p>Everything on this page is encrypted. The passphrase decrypts it here in your browser — it is never sent anywhere.</p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase">
    <button class="go" id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; };
  var b64 = function (s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var D = null;

  /* localStorage throws on a file:// origin and in private browsing, and a
     picker that silently never sticks is indistinguishable from a broken page.
     Fall back to memory for the life of the tab. */
  /* Guarding only the write is not enough: on a file:// origin setItem throws
     while getItem happily returns null, so a value written to memory was read
     back from an empty store and the picker never stuck. Memory wins whenever
     it has the value. */
  var mem = {};
  var store = {
    get: function (k) {
      if (Object.prototype.hasOwnProperty.call(mem, k)) return mem[k];
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    set: function (k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, v); } catch (e) { /* memory already has it */ }
    },
  };

  async function unlock(pass) {
    var p = window.__DASH__;
    if (!p) throw new Error("This page has no data. Rebuild it with npm run dashboard.");
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(p.salt), iterations: p.iter || 210000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    /* WebCrypto wants the GCM tag appended to the ciphertext; node hands it
       back separately, so it is joined here rather than shipped joined. */
    var ct = b64(p.ct), tag = b64(p.tag);
    var buf = new Uint8Array(ct.length + tag.length);
    buf.set(ct); buf.set(tag, ct.length);
    var clear = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, buf);
    return JSON.parse(new TextDecoder().decode(clear));
  }

  $("unlock").addEventListener("click", go);
  $("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  /* The gate is replaced once unlocked, so this can fire into nothing. */
  setTimeout(function () { var el = $("pass"); if (el) el.focus(); }, 200);

  async function go() {
    var v = $("pass").value;
    if (!v) return;
    $("unlock").disabled = true; $("err").textContent = "Decrypting…";
    try {
      D = await unlock(v);
      try { sessionStorage.setItem("jynx-dash", v); } catch (e) { mem["jynx-dash"] = v; }
      render("summary");
    } catch (e) {
      /* GCM fails closed: a wrong passphrase is indistinguishable from tampered
         ciphertext, and both mean the same thing here. */
      $("err").textContent = "That passphrase does not decrypt this page.";
      $("unlock").disabled = false; $("pass").select();
    }
  }

  /* ---------- views ---------- */
  var TABS = [["summary", "Summary"], ["code", "Code"], ["approvals", "Approvals"], ["docs", "Docs"], ["security", "Security"], ["people", "Setup"], ["hire", "Enrol"]];

  function chrome(tab, body) {
    app.innerHTML =
      '<div class="wrap">' +
      '<div class="top"><span class="eyes"><i></i><i></i></span><b>JYNX</b>' +
        '<span class="cls">Confidential · Internal</span>' +
        '<span class="built">' + esc(D.head) + ' · built ' + new Date(D.built).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) + '</span></div>' +
      '<nav>' + TABS.map(function (t) {
        return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? "on" : "") + '">' + t[1] + '</button>';
      }).join("") + '</nav>' + body + '</div>';
    Array.prototype.forEach.call(app.querySelectorAll("nav button"), function (b) {
      b.addEventListener("click", function () { render(b.dataset.t); });
    });
  }

  function tbl(head, rows) {
    return '<div class="scroll card"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
      '</tr></thead><tbody>' + (rows.join("") || '<tr><td class="muted">Nothing.</td></tr>') + '</tbody></table></div>';
  }

  function render(tab) {
    if (tab === "summary") { chrome(tab, summaryView()); wireMine(); countApprovals(); return; }
    if (tab === "code") return chrome(tab, codeView());
    if (tab === "docs") return chrome(tab, docsView());
    if (tab === "security") return chrome(tab, secView());
    if (tab === "people") return chrome(tab, setupView());
    if (tab === "approvals") { chrome(tab, apprShell()); loadApprovals(); return; }
    if (tab === "hire") { chrome(tab, hireView()); wireHire(); }
  }

  /* ---------- my tasks ----------
     For anyone who is not a developer: the tasks with their name on them, and a
     box to say where they have got to. There is no API yet, so a reply is
     posted to the channel and written into TODO.md by hand at the other end —
     which is exactly what task 58 removes. Nothing about this tab changes when
     it does. */
  /* The landing page: you first, then everyone. Two questions answered in one
     screen — what is on me, and where is the team — because they were on two
     tabs and nobody looks at the second one. */
  function summaryView() {
    var who = store.get("jynx-who") || "";
    return mineView(who) + teamView();
  }

  /* How many approvals are outstanding, read live from the channels rather than
     from the snapshot, because a number baked an hour ago is worse than none. */
  async function countApprovals() {
    var el = $("apprcount"), meEl = $("apprmine");
    if (!el) return;
    var who = store.get("jynx-who") || "";
    var since = Math.floor(Date.now() / 1000) - 86400;
    var total = 0, mine = 0;
    for (var i = 0; i < D.people.length; i++) {
      var per = D.people[i];
      var msgs = await pollTopic(per.topic, since);
      var open = {}, decided = {};
      msgs.forEach(function (m) {
        var r = m.message.match(/jynx-request ([0-9a-f]{6}) /);
        if (r) open[r[1]] = 1;
        var d = m.message.match(/decision ([0-9a-f]{6}) (approved|denied)/);
        if (d) decided[d[1]] = 1;
      });
      var n = Object.keys(open).filter(function (id) { return !decided[id]; }).length;
      total += n;
      if (per.session === who) mine = n;
    }
    el.textContent = String(total);
    el.style.color = total ? "var(--warn)" : "var(--ok)";
    if (meEl) meEl.textContent = who ? (mine + " on you") : "pick your name";
  }

  function mineView(who) {
    var picker = '<div class="card" style="margin-bottom:14px"><h3>Who are you</h3>' +
      '<div class="act">' + D.people.map(function (p) {
        return '<button class="pick ' + (p.session === who ? "go" : "") + '" data-who="' + esc(p.session) + '" style="width:auto;margin:0">' + esc(p.person) + "</button>";
      }).join("") + "</div></div>";
    if (!who) return picker + '<div class="card muted" style="margin-bottom:22px">Pick your name to see what is on you.</div>';

    var me = D.people.filter(function (p) { return p.session === who; })[0];
    if (!me) return picker;
    var open = me.tasks.filter(function (t) { return t.state !== "done"; });
    var done = me.tasks.filter(function (t) { return t.state === "done"; });

    return picker +
      '<div class="grid">' +
        card("On you", '<div class="big">' + open.length + '</div><div class="sub">open task' + (open.length === 1 ? "" : "s") + '</div>') +
        card("Approvals waiting", '<div class="big" id="apprcount">…</div><div class="sub" id="apprmine">checking</div>') +
        card("Done", '<div class="big">' + done.length + '</div><div class="sub">' + esc(me.person) + "</div>") +
      "</div>" +
      '<div class="card" style="margin-bottom:14px"><h3>Your tasks</h3>' +
      '<div class="muted">Say where you have got to on any of them — including that you are stuck, which is a real update and worth sending early.</div></div>' +
      (open.length ? open.map(function (t) {
        return '<div class="card" style="margin-bottom:12px" data-task="' + esc(t.id) + '">' +
          '<div class="who"><h2>' + esc(t.task) + '</h2><span class="s">' + esc(t.id) + "</span></div>" +
          '<span class="tag ' + t.state + '">' + t.state + "</span>" +
          (t.note ? '<div class="muted" style="margin-top:9px">' + esc(t.note) + "</div>" : "") +
          '<textarea class="upd" rows="3" placeholder="What you found, what you decided, what you are stuck on" ' +
          'style="width:100%;margin-top:12px;font-family:var(--body);font-size:14px;padding:12px;' +
          'border:1px solid var(--line);border-radius:11px;background:var(--sunk);color:var(--ink);outline:none;resize:vertical"></textarea>' +
          '<div class="act"><button class="stuck" style="width:auto;margin:0">I am stuck</button>' +
          '<button class="go send" style="width:auto;margin:0">Send update</button></div>' +
          '<div class="err umsg"></div></div>';
      }).join("") : '<div class="card muted">Nothing open. </div>') +
      (done.length ? '<div class="card"><h3>Done</h3>' + done.map(function (t) {
        return '<div class="muted">✓ ' + esc(t.id) + " " + esc(t.task) + "</div>"; }).join("") + "</div>" : "");
  }

  function wireMine() {
    Array.prototype.forEach.call(app.querySelectorAll(".pick"), function (b) {
      b.addEventListener("click", function () { store.set("jynx-who", b.dataset.who); render("mine"); });
    });
    Array.prototype.forEach.call(app.querySelectorAll(".card[data-task]"), function (cardEl) {
      var who = store.get("jynx-who");
      var send = function (stuck) {
        var box = cardEl.querySelector(".upd"), m = cardEl.querySelector(".umsg");
        var text = (box.value || "").trim();
        if (!text && !stuck) { m.className = "err umsg"; m.textContent = "Say something first."; return; }
        m.className = "err umsg"; m.textContent = "Sending…";
        fetch("https://ntfy.sh/" + D.topics[who], {
          method: "POST", headers: { Priority: stuck ? "4" : "3" },
          body: "jynx-update " + cardEl.dataset.task + " " + who + (stuck ? " STUCK" : "") + " :: " + (text || "Stuck and need a hand."),
        }).then(function () {
          m.className = "err umsg ok";
          m.textContent = stuck ? "Sent, flagged as stuck. Someone will pick it up." : "Sent.";
          box.value = "";
        }).catch(function () { m.textContent = "Could not send it."; });
      };
      cardEl.querySelector(".send").addEventListener("click", function () { send(false); });
      cardEl.querySelector(".stuck").addEventListener("click", function () { send(true); });
    });
  }

  function teamView() {
    var t = D.totals;
    var cards =
      '<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);' +
      'margin:30px 0 12px;padding-top:22px;border-top:1px solid var(--line)">THE TEAM</h3>' +
      '<div class="grid">' +
      card("Tasks", '<div class="big">' + t.done + " / " + t.tasks + '</div><div class="sub">' + t.doing + " in progress · " + t.human + " on a human</div>") +
      card("Open PRs", '<div class="big">' + D.prs.length + '</div><div class="sub">' + D.prs.filter(function (p) { return p.isDraft; }).length + " draft</div>") +
      card("Checks", D.checks.map(function (c) { return '<div>' + (c.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>') + " " + esc(c.label) + "</div>"; }).join("")) +
      card("Findings", '<div class="big">' + D.redteam.filter(function (f) { return f.severity === "high"; }).length + '</div><div class="sub">high · ' + D.redteam.length + " total</div>") +
      '</div>';
    return cards + D.people.map(function (p) {
      var open = p.tasks.filter(function (x) { return x.state !== "done"; });
      return '<div class="card" style="margin-bottom:12px">' +
        '<div class="who"><h2>' + esc(p.person) + '</h2><span class="s">' + esc(p.session) + " · " + esc(p.role) + '</span></div>' +
        '<div class="muted">' + p.commitCount + " commits in 7 days · " + open.length + " open · " + p.prs.length + " PRs</div>" +
        (open.length ? '<table style="margin-top:10px">' + open.slice(0, 8).map(function (x) {
          return '<tr><td class="k">' + esc(x.id) + '</td><td><span class="tag ' + x.state + '">' + x.state + "</span></td><td>" + esc(x.task) + "</td></tr>";
        }).join("") + "</table>" : "") +
        (p.prs.length ? '<div style="margin-top:10px">' + p.prs.map(function (r) {
          return '<div class="muted">⬆ PR #' + r.number + " " + esc(r.title) + "</div>"; }).join("") + "</div>" : "") +
        "</div>";
    }).join("");
  }
  function card(h, b) { return '<div class="card"><h3>' + h + "</h3>" + b + "</div>"; }

  function codeView() {
    return '<div class="grid">' + D.checks.map(function (c) {
      return card(c.label, '<div class="big" style="color:var(--' + (c.ok ? "ok" : "bad") + ')">' + (c.ok ? "pass" : "FAIL") + "</div>");
    }).join("") + "</div>" +
    tbl(["#", "PR", "Author", ""], D.prs.map(function (p) {
      return "<tr><td class=\"k\">#" + p.number + "</td><td>" + esc(p.title) + '</td><td class="k">' + esc(p.author && p.author.login) +
        "</td><td>" + (p.isDraft ? '<span class="tag">draft</span>' : "") + "</td></tr>";
    })) +
    '<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);margin:22px 0 10px">IN PROGRESS</h3>' +
    tbl(["#", "Task", "Owner", "Left to do"], D.tasks.filter(function (t) { return t.state === "doing"; }).map(function (t) {
      return '<tr><td class="k">' + esc(t.id) + "</td><td>" + esc(t.task) + '</td><td class="k">' + esc(t.owner) +
        '</td><td class="muted">' + esc(t.note) + "</td></tr>";
    }));
  }

  function docsView() {
    return '<div class="card" style="margin-bottom:14px"><h3>Classification</h3>' +
      '<div class="muted">Demo goes outside the company and carries the Jynx layer. Internal never leaves the team. ' +
      'Moving a document between them only takes effect once <code>npm run publish-docs</code> runs — that is what withdraws it from the web.</div></div>' +
      tbl(["Document", "Zone", "Title", "Responsible"], D.docs.map(function (d) {
        return "<tr><td>" + esc(d.file) + '</td><td><span class="tag ' + d.zone + '">' + d.zone + "</span></td><td>" +
          esc(d.title) + '</td><td class="k">' + esc(d.responsible) + "</td></tr>";
      }));
  }

  function secView() {
    var order = { high: 0, medium: 1, low: 2, info: 3 };
    var f = D.redteam.slice().sort(function (a, b) { return (order[a.severity] || 3) - (order[b.severity] || 3); });
    return '<div class="card" style="margin-bottom:14px"><h3>Red team</h3>' +
      '<div class="muted">Five viewpoints: outsider, customer, internal, supply chain, and the sessions themselves. ' +
      'A clean run is a claim about these checks, not about the system.</div></div>' +
      tbl(["Severity", "Finding"], f.map(function (x) {
        return '<tr><td><span class="tag ' + x.severity + '">' + x.severity + "</span></td><td>" + esc(x.what) + "</td></tr>";
      }));
  }

  function setupView() {
    /* Setting a key happens HERE, in the dashboard, because that is where a
       person already is and because a base64 blob carried into a terminal is
       not a user system. It works because the dashboard passphrase — which you
       have already typed to be reading this — is a secret the team holds and
       the repository does not. The page derives the verifier, encrypts it under
       that passphrase, and posts it; the machine running `npm run listen` has
       the same passphrase and is the only thing that can open it. */
    var rows = D.people.map(function (p) {
      return '<div class="card" style="margin-bottom:12px" data-who="' + esc(p.session) + '">' +
        '<div class="who"><h2>' + esc(p.person) + '</h2><span class="s">' + esc(p.session) + " · " + esc(p.topic) + '</span></div>' +
        '<div class="muted">' + (p.approve === "none" ? "No key set — cannot approve anything yet."
          : "Key set · " + esc(p.approve)) + "</div>" +
        '<div class="act">' +
        '<input class="k1" type="password" inputmode="numeric" maxlength="12" placeholder="' + (p.approve === "none" ? "new PIN" : "new PIN") + '">' +
        '<input class="k2" type="password" inputmode="numeric" maxlength="12" placeholder="again">' +
        '<button class="go setk" style="width:auto;margin:0">' + (p.approve === "none" ? "Set key" : "Change key") + "</button>" +
        "</div><div class=\"err kmsg\"></div></div>";
    }).join("");
    setTimeout(wireKeys, 0);
    return '<div class="card" style="margin-bottom:14px"><h3>Set a key</h3>' +
      '<div class="muted">Choose a PIN here — it is never sent. This page derives a verifier from it, encrypts that under the dashboard passphrase you already typed, and posts it; ' +
      'only a machine running <code>npm run listen</code> with the same passphrase can open it. Nothing to paste and no terminal to visit.</div></div>' +
      rows +
      '<div class="card" style="margin-bottom:14px"><h3>Approval</h3>' +
      '<div class="muted">Each person holds their own key on their own machine — a PIN or an authenticator, in a 600 file outside the repo. ' +
      'Nobody can approve for anybody else, and no session can approve its own request. Approvals only take effect while <code>npm run listen</code> is running.</div></div>' +
      tbl(["Person", "Session", "Channel", "Approval", "Owns"], D.people.map(function (p) {
        return "<tr><td>" + esc(p.person) + '</td><td class="k">' + esc(p.session) + '</td><td class="k">' + esc(p.topic) +
          '</td><td><span class="tag ' + (p.approve === "none" ? "blocked" : "done") + '">' + esc(p.approve) + "</span></td>" +
          '<td class="muted">' + esc(p.owns.slice(0, 4).join(", ")) + (p.owns.length > 4 ? " +" + (p.owns.length - 4) : "") + "</td></tr>";
      }));
  }

  /* ---------- approvals, live ----------
     The snapshot is a photograph and approvals change by the minute, so this
     tab does not read it. It asks each channel what is outstanding right now:
     every request announced in the last day, minus everything already decided.
     Same proof as the approval page — the page never decides, a listening
     session does. */
  function apprShell() {
    return '<div class="card" style="margin-bottom:14px"><h3>Waiting</h3>' +
      '<div class="muted">Read live from the channels, not from the snapshot. Approving needs your PIN or code, ' +
      'and a session must be running <code>npm run listen</code> or nothing acts on it.</div></div>' +
      '<div id="appr"><div class="card muted">Reading channels…</div></div>';
  }

  async function pollTopic(topic, sinceSec) {
    try {
      var res = await fetch("https://ntfy.sh/" + topic + "/json?poll=1&since=" + sinceSec);
      var t = await res.text();
      return (t.trim() ? t.trim().split("\n") : []).map(function (l) {
        try { return JSON.parse(l); } catch (e) { return null; }
      }).filter(function (m) { return m && m.event === "message" && m.message; });
    } catch (e) { return []; }
  }

  async function loadApprovals() {
    var since = Math.floor(Date.now() / 1000) - 86400;
    var out = [];
    for (var i = 0; i < D.people.length; i++) {
      var per = D.people[i];
      var msgs = await pollTopic(per.topic, since);
      var open = {}, decided = {};
      msgs.forEach(function (m) {
        var r = m.message.match(/jynx-request ([0-9a-f]{6}) (\S+) :: (.+)/);
        if (r) open[r[1]] = { id: r[1], from: r[2], what: r[3].trim(), at: m.time, who: per.session, person: per };
        var d = m.message.match(/decision ([0-9a-f]{6}) (approved|denied)/);
        if (d) decided[d[1]] = d[2];
      });
      Object.keys(open).forEach(function (id) { if (!decided[id]) out.push(open[id]); });
    }
    var el = $("appr");
    if (!out.length) { el.innerHTML = '<div class="card muted">Nothing waiting on anyone.</div>'; return; }
    el.innerHTML = out.map(function (r, i) {
      var isTotp = r.person.approve === "totp";
      var mins = Math.round((Date.now() / 1000 - r.at) / 60);
      return '<div class="card" style="margin-bottom:12px" data-i="' + i + '">' +
        '<div class="who"><h2>' + esc(r.what) + '</h2><span class="s">' + esc(r.id) + "</span></div>" +
        '<div class="muted">for ' + esc(r.person.person) + " · asked by " + esc(r.from) + " · " +
          (mins < 60 ? mins + "m" : Math.round(mins / 60) + "h") + " ago</div>" +
        (r.person.approve === "none"
          ? '<div class="muted bad" style="margin-top:10px">' + esc(r.person.person) +
            ' has no key set up, so this cannot be decided yet.</div>'
          : '<div class="act"><input class="pin" inputmode="numeric" maxlength="' + (isTotp ? 6 : 12) +
            '" placeholder="' + (isTotp ? "code" : "PIN") + '">' +
            '<button class="no">Deny</button><button class="go yes" style="width:auto;margin:0">Approve</button></div>' +
            '<div class="err msg"></div>') +
        "</div>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".card[data-i]"), function (cardEl) {
      var r = out[Number(cardEl.dataset.i)];
      var yes = cardEl.querySelector(".yes"), no = cardEl.querySelector(".no");
      if (!yes) return;
      yes.addEventListener("click", function () { decide(cardEl, r, "approve"); });
      no.addEventListener("click", function () { decide(cardEl, r, "deny"); });
    });
  }

  async function decide(cardEl, r, verb) {
    var input = cardEl.querySelector(".pin"), m = cardEl.querySelector(".msg");
    var secret = (input.value || "").trim();
    var isTotp = r.person.approve === "totp";
    if (isTotp ? !/^\d{6}$/.test(secret) : !/^\d{4,12}$/.test(secret)) {
      m.className = "err msg"; m.textContent = isTotp ? "Six digits." : "Enter the PIN."; return;
    }
    cardEl.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    m.className = "err msg"; m.textContent = "Checking…";

    var payload;
    if (isTotp) payload = secret;
    else {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
      var saltHex = r.person.approveSalt || "";
      var sb = new Uint8Array(saltHex.length / 2);
      for (var i = 0; i < sb.length; i++) sb[i] = parseInt(saltHex.substr(i * 2, 2), 16);
      var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sb, iterations: D.iter || 210000, hash: "SHA-256" }, base, 256);
      var key = await crypto.subtle.importKey("raw", bits, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      var sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(r.id));
      payload = Array.prototype.map.call(new Uint8Array(sig), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    }

    var from = Math.floor(Date.now() / 1000);
    try {
      await fetch("https://ntfy.sh/" + r.person.topic, { method: "POST", headers: { Priority: "3" },
        body: verb + " " + r.id + " " + payload });
    } catch (e) { m.textContent = "Could not reach the channel."; cardEl.querySelectorAll("button").forEach(function (b) { b.disabled = false; }); return; }

    var deadline = Date.now() + 30000;
    while (Date.now() < deadline) {
      var msgs = await pollTopic(r.person.topic, from);
      for (var j = 0; j < msgs.length; j++) {
        var txt = msgs[j].message;
        if (txt.indexOf("decision " + r.id + " approved") > -1 || txt.indexOf("decision " + r.id + " denied") > -1) {
          cardEl.innerHTML = '<div class="who"><h2>' + esc(r.what) + '</h2></div><div class="muted ok">' +
            (txt.indexOf("approved") > -1 ? "Approved." : "Denied.") + " Done.</div>";
          return;
        }
        if (txt.indexOf("decision " + r.id + " rejected") > -1) {
          m.textContent = isTotp ? "That code did not match." : "That PIN was wrong.";
          input.value = ""; cardEl.querySelectorAll("button").forEach(function (b) { b.disabled = false; }); return;
        }
      }
      await new Promise(function (x) { setTimeout(x, 2000); });
    }
    m.textContent = "Sent, but nothing answered — no session is running npm run listen.";
    cardEl.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
  }

  function wireKeys() {
    Array.prototype.forEach.call(app.querySelectorAll(".card[data-who]"), function (cardEl) {
      var btn = cardEl.querySelector(".setk");
      if (!btn) return;
      btn.addEventListener("click", async function () {
        var who = cardEl.dataset.who;
        var a = cardEl.querySelector(".k1").value.trim(), b = cardEl.querySelector(".k2").value.trim();
        var m = cardEl.querySelector(".kmsg");
        m.className = "err kmsg";
        if (!/^\d{4,12}$/.test(a)) { m.textContent = "Four to twelve digits."; return; }
        if (a !== b) { m.textContent = "They do not match."; return; }
        btn.disabled = true; m.textContent = "Building…";

        var te = new TextEncoder();
        var hx = function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); };
        var salt = crypto.getRandomValues(new Uint8Array(16));
        var base = await crypto.subtle.importKey("raw", te.encode(a), "PBKDF2", false, ["deriveBits"]);
        var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: D.iter || 210000, hash: "SHA-256" }, base, 256);
        var payload = JSON.stringify({ who: who, auth: "pin", salt: hx(salt), verifier: hx(bits) });

        /* Encrypted under the dashboard passphrase, which is why this can go
           over an ordinary channel: the verifier is what grants approval, so it
           must never travel in the clear. */
        var pass = (function(){ try { return sessionStorage.getItem("jynx-dash"); } catch (e) { return mem["jynx-dash"]; } })();
        var wsalt = crypto.getRandomValues(new Uint8Array(16));
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var pk = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
        var ak = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: wsalt, iterations: 100000, hash: "SHA-256" },
                                               pk, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, ak, te.encode(payload)));
        var packed = new Uint8Array(12 + ct.length); packed.set(iv); packed.set(ct, 12);

        m.textContent = "Sending…";
        var from = Math.floor(Date.now() / 1000);
        try {
          await fetch("https://ntfy.sh/" + D.topics[who], { method: "POST", headers: { Priority: "1" },
            body: "keyset " + who + " " + hx(wsalt) + " " + btoa(String.fromCharCode.apply(null, packed)) });
        } catch (e) { m.textContent = "Could not reach the channel."; btn.disabled = false; return; }

        var until = Date.now() + 30000;
        while (Date.now() < until) {
          var msgs = await pollTopic(D.topics[who], from);
          for (var i = 0; i < msgs.length; i++) {
            if (msgs[i].message.indexOf("keyed " + who) > -1) {
              m.className = "err kmsg ok";
              m.textContent = "Set. Nothing else to do — approvals will use this from now on.";
              cardEl.querySelector(".k1").value = ""; cardEl.querySelector(".k2").value = "";
              btn.disabled = false; return;
            }
          }
          await new Promise(function (r) { setTimeout(r, 2000); });
        }
        m.textContent = "Sent, but no machine is running npm run listen with this passphrase, so nothing stored it.";
        btn.disabled = false;
      });
    });
  }

  function hireView() {
    return '<div class="card"><h3>Start an enrolment interview</h3>' +
      '<div class="muted" style="margin-bottom:14px">This does not enrol anyone. It asks a session to run the interview and report back — ' +
      'the page cannot be trusted to decide anything, so it does not. A session with the real key checks your code and acts.</div>' +
      '<input id="hname" placeholder="Their name" style="margin-bottom:8px">' +
      '<input id="hrole" placeholder="Developer or team member" style="margin-bottom:8px">' +
      '<div class="act"><input id="hcode" inputmode="numeric" maxlength="6" placeholder="000000">' +
      '<button class="go" style="width:auto;margin:0" id="hgo">Request</button></div>' +
      '<div class="err" id="hmsg"></div>' +
      '<div class="muted" style="margin-top:14px">The six digits are your authenticator code. A code is worthless thirty seconds later, ' +
      'which is why it can travel on an ordinary channel.</div></div>';
  }

  function wireHire() {
    $("hgo").addEventListener("click", async function () {
      var name = ($("hname").value || "").trim(), role = ($("hrole").value || "").trim();
      var code = ($("hcode").value || "").trim();
      var m = $("hmsg");
      if (!name) { m.textContent = "Who?"; return; }
      if (!/^\d{6}$/.test(code)) { m.textContent = "Six digits from your authenticator."; return; }
      $("hgo").disabled = true; m.textContent = "Sending…"; m.className = "err";
      try {
        var topic = D.topics[Object.keys(D.topics)[0]];
        await fetch("https://ntfy.sh/" + topic, {
          method: "POST", headers: { Priority: "4" },
          body: "jynx-do enrol " + code + " :: " + name + " :: " + (role || "team"),
        });
        m.className = "err ok";
        m.textContent = "Sent. A listening session will verify the code and run the interview.";
      } catch (e) { m.textContent = "Could not reach the channel."; $("hgo").disabled = false; }
    });
  }

  /* Unlock without retyping when coming back within the same tab session. */
  var saved = (function(){ try { return sessionStorage.getItem("jynx-dash"); } catch (e) { return mem["jynx-dash"]; } })();
  if (saved) { $("pass").value = saved; go(); }
})();
</script>
